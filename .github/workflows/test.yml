name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 -timeout 5m ./...

      - name: Test with the lean HTTP/2 server
        run: go test -race -count=1 -timeout 5m ./...
        env:
          SAMIZDAT_TEST_LEAN_H2: "1"

      - name: Test with a shaping server
        run: go test -race -count=1 -timeout 5m ./...
        env:
          SAMIZDAT_TEST_SHAPING_SERVER: "1"
